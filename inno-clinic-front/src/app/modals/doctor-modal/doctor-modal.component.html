<h2 mat-dialog-title>Doctor</h2>
<div class="dialog-container" [ngStyle]="{'height': isEdit ? '620px' : '460px'}">
    <div class="doctor-form">
        @if (isEdit){
            <div class="form-group">
                <label for="form-control">First name</label>
                <input matInput  type="text" class="form-control" [value]="firstName">
                <p>
            </div>
            <div class="form-group">
                <label for="form-control">Last name</label>
                <input matInput  type="text" class="form-control" [value]="lastName">
                <p>
            </div>
            <div class="form-group">
                <label for="form-control">Middle name</label>
                <input matInput  type="text" class="form-control" [value]="middleName">
                <p>
            </div>
        }

        <div class="form-group">
            <label for="form-control">Birthday</label>
            <input matInput  type="date" class="form-control" [min]="getMinBirthday()" [max]="getMaxBirthday()" [value]="dateOfBirth" onkeydown="return false;">
            <p>
        </div>
        <div class="form-group">
            <label for="form-control">Specialization</label>
            <select name="specialization" class="form-control"></select>
            <p>
        </div>
        <div class="form-group">
            <label>Office</label>
            <select name="office" class="form-control"></select>
            <p>
        </div>
        @if (!isEdit){
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" class="form-control" placeholder="email@gmail.com">
                <p>
            </div>
        }

        <div class="buttons">
            <button class="btn btn-dark" mat-dialog-close>Accept</button>
            <button class="btn" mat-dialog-close>Back</button>
        </div>
    </div>
</div>

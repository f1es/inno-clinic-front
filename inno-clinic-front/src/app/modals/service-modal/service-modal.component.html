<h2 mat-dialog-title>Service</h2>

<div class="dialog-container">
    <div class="service-form">
        <div class="form-group">
            <label for="name">Name</label>
             <input type="text" class="form-control" placeholder="some name" [value]="serviceName">
            <p>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" class="form-control" placeholder="100" [value]="price">
            <p>
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select name="status" class="form-control" [value]="isActive">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
            <p>
        </div>
        <div class="form-group">
            <label for="specialization">Specialization</label>
            <select name="specialization" class="form-control" [value]="specializationId"></select>
            <p>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" class="form-control" [value]="serviceCategoryId"></select>
        </div>
        <div class="buttons">
            <button class="btn btn-dark" mat-dialog-close>Accept</button>
            <button class="btn" mat-dialog-close>Back</button>
        </div>
    </div>
</div>

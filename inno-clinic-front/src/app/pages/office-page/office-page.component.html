<app-header></app-header>
<div class="page-container">
    <div class="top">
        <div class="left">
            <div class="office-container">
                <div class="address">{{ office.address }}</div>
                <div class="phone">{{ office.registryPhoneNumber }}</div>
                <div class="status" [innerHTML]="getStatus()"></div>
                <div class="photo"><img [src]="office.photoId" alt=""></div>
            </div>
            <div class="make-appointment">Make an appointment</div>
        </div>
        <div class="right">
            <div class="doctors-container">
                <h4>Doctors</h4>
                <div class="grid-container">
                    @for (doctor of doctors; track doctor){
                        <app-doctor-card [doctor]="doctor"></app-doctor-card>
                    }
                </div>
            </div>
        </div>
    </div>
    <div class="bottom"></div>
</div>

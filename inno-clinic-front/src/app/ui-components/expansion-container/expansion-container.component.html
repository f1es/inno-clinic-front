<div class="panel">
    <label for="panel" class="panel-header" (click)="changeState()">
        <h4>{{header}}</h4>
        <div class="arrow">{{ isExpanded ? '-' : '+' }}</div>
    </label>
    <div class="panel-content">
        @if (isExpanded){
            <div class="grid-container" [ngStyle]="{'grid-template-columns': Columns}">
                <ng-content></ng-content>
            </div>
        }
    </div>
</div>
